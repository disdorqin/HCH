[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hch-forecast-repair"
version = "0.1.0"
description = "History-calibrated correction of issued multi-horizon forecasts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
